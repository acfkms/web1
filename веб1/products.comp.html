<section class="products-section">
    <h2 class="products-section">наші товари</h2>
    <div class="products-grid">
        <app-product-card
            *ngFor="let product of products"
            [name]="product.name"
            [price]="product.price"
            [description]="product.description"
            (buy)="onProductBuy($event)">
        </app-product-card>
    </div>
</section>
